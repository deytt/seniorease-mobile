name: mobile
description: "SeniorEase — plataforma de inclusão digital para idosos (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.2
  lottie: ^3.3.3
  showcaseview: ^5.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  firebase_storage: ^13.4.3
  image_picker: ^1.2.2
  mask_text_input_formatter: ^2.9.0
  google_sign_in: ^6.2.1
  audioplayers: ^6.0.0
  firebase_messaging: ^16.4.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/sounds/
